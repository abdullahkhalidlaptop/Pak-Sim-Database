<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pak Sim Info</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top left, #0f172a, #020617);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col items-center justify-start p-4 sm:p-8">

  <!-- Header & Logo -->
  <header class="w-full max-w-3xl text-center my-6 flex flex-col items-center">
    <div class="mb-4 p-3 bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl flex items-center justify-center">
      <img src="/logo.png" alt="Portal Logo" class="h-16 w-auto object-contain" onError="this.style.display='none'" />
    </div>
    
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold uppercase tracking-widest mb-3">
      Protected System
    </div>
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">
      Pak SIM Info Lookup
    </h1>
    <p class="text-slate-400 text-sm sm:text-base mt-2">
      Latest Database 2023
    </p>
  </header>

  <main class="w-full max-w-3xl space-y-6">

    <!-- Form -->
    <form id="searchForm" class="space-y-4">
      <div class="relative flex items-center">
        <input
          type="text"
          id="queryInput"
          placeholder="Enter CNIC / Phone Number"
          class="w-full py-4 pl-5 pr-32 bg-slate-900/80 border border-slate-700/60 rounded-2xl backdrop-blur-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all shadow-xl"
          required
        />
        <button
          type="submit"
          id="submitBtn"
          class="absolute right-2 px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm rounded-xl transition-all shadow-lg hover:shadow-indigo-500/25 flex items-center gap-2"
        >
          <span id="btnText">Search</span>
          <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </div>

      <!-- Turnstile -->
      <div class="flex justify-center">
        <div id="turnstileContainer"></div>
      </div>
    </form>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm text-center"></div>

    <!-- Export Toolbar -->
    <div id="exportToolbar" class="hidden flex justify-between items-center bg-slate-900/80 border border-slate-800 p-4 rounded-2xl backdrop-blur-md">
      <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Export Results</span>
      <div class="flex gap-3">
        <button onclick="downloadCSV()" class="px-4 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 text-xs font-bold rounded-xl transition-all flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Download CSV
        </button>
        <button onclick="downloadPDF()" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 text-xs font-bold rounded-xl transition-all flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          Download PDF
        </button>
      </div>
    </div>

    <!-- Results Area -->
    <div id="resultsContainer" class="space-y-4"></div>

  </main>

  <script>
    let turnstileToken = '';
    let turnstileWidgetId = null;
    let currentResults = [];

    async function initTurnstile() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();

        if (!res.ok || !data.siteKey) {
          throw new Error(data.error || 'Failed to load security site key.');
        }

        const checkInterval = setInterval(() => {
          if (window.turnstile) {
            clearInterval(checkInterval);
            turnstileWidgetId = turnstile.render('#turnstileContainer', {
              sitekey: data.siteKey,
              theme: 'dark',
              callback: (token) => { turnstileToken = token; },
              'expired-callback': () => { turnstileToken = ''; }
            });
          }
        }, 100);
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.remove('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', initTurnstile);

    const form = document.getElementById('searchForm');
    const queryInput = document.getElementById('queryInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const resultsContainer = document.getElementById('resultsContainer');
    const exportToolbar = document.getElementById('exportToolbar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;

      if (!turnstileToken) {
        errorAlert.textContent = "Please complete the security check first.";
        errorAlert.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = "Searching...";
      btnSpinner.classList.remove('hidden');
      errorAlert.classList.add('hidden');
      exportToolbar.classList.add('hidden');
      resultsContainer.innerHTML = '';
      currentResults = [];

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(q)}&cf-turnstile-response=${encodeURIComponent(turnstileToken)}`);
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Search failed.');

        if (data.results && data.results.length > 0) {
          currentResults = data.results;
          renderResults(data.results);
          exportToolbar.classList.remove('hidden');
        } else {
          showEmptyState();
        }
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = "Search";
        btnSpinner.classList.add('hidden');

        if (window.turnstile && turnstileWidgetId !== null) {
          turnstile.reset(turnstileWidgetId);
          turnstileToken = '';
        }
      }
    });

    function renderResults(results) {
      resultsContainer.innerHTML = results.map((item, index) => `
        <div class="p-6 bg-slate-900/60 border border-slate-800 backdrop-blur-md rounded-2xl shadow-xl space-y-4 transition-all hover:border-slate-700">
          <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
            <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Record #${index + 1}</span>
            <button onclick="copyToClipboard('${escapeJs(JSON.stringify(item))}', this)" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg transition-all">
              Copy JSON
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${createField('Name', item.name)}
            ${createField('Phone', item.phone)}
            ${createField('CNIC', item.cnic)}
            ${createField('Address', item.address, true)}
          </div>
        </div>
      `).join('');
    }

    function createField(label, value, fullWidth = false) {
      return `
        <div class="${fullWidth ? 'sm:col-span-2' : ''} bg-slate-950/40 border border-slate-800/60 p-3 rounded-xl flex justify-between items-center">
          <div>
            <div class="text-xs text-slate-500 font-medium">${label}</div>
            <div class="text-sm text-slate-200 font-semibold mt-0.5">${value || 'N/A'}</div>
          </div>
          <button onclick="copyToClipboard('${escapeJs(value)}', this)" class="text-slate-500 hover:text-slate-300 p-1 rounded transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </button>
        </div>
      `;
    }

    function showEmptyState() {
      resultsContainer.innerHTML = `
        <div class="text-center py-12 bg-slate-900/30 border border-slate-800/50 rounded-2xl">
          <p class="text-slate-400 text-sm">No records found matching your query.</p>
        </div>
      `;
    }

    function downloadCSV() {
      if (!currentResults.length) return;
      const headers = ["Name", "Phone", "CNIC", "Address"];
      const rows = currentResults.map(r => [
        `"${(r.name || '').replace(/"/g, '""')}"`,
        `"${(r.phone || '').replace(/"/g, '""')}"`,
        `"${(r.cnic || '').replace(/"/g, '""')}"`,
        `"${(r.address || '').replace(/"/g, '""')}"`
      ]);

      const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `search_results_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadPDF() {
      if (!currentResults.length) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Search Results Report", 14, 20);

      const tableData = currentResults.map((r, i) => [
        i + 1,
        r.name || 'N/A',
        r.phone || 'N/A',
        r.cnic || 'N/A',
        r.address || 'N/A'
      ]);

      doc.autoTable({
        startY: 30,
        head: [['#', 'Name', 'Phone', 'CNIC', 'Address']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [79, 70, 229] }
      });

      doc.save(`search_results_${Date.now()}.pdf`);
    }

    function escapeJs(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text);
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="text-emerald-400 text-xs">Copied!</span>';
      setTimeout(() => { btn.innerHTML = originalText; }, 1500);
    }
  </script>
</body>
</html>
