<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Database Lookup Portal</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #020617;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col items-center justify-start p-3 sm:p-8">

  <!-- Header & Logo -->
  <header class="w-full max-w-3xl text-center my-4 sm:my-6 flex flex-col items-center">
    <div class="mb-3 p-2.5 bg-slate-900 border border-slate-800 rounded-2xl shadow-lg flex items-center justify-center">
      <img src="/assets/logo.png" alt="Portal Logo" class="h-12 sm:h-16 w-auto object-contain" onError="this.style.display='none'" />
    </div>
    
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold uppercase tracking-widest mb-2">
      Protected System
    </div>
    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">
      Information Finder
    </h1>
    <p class="text-slate-400 text-xs sm:text-base mt-1">
      Secure search portal
    </p>
  </header>

  <main class="w-full max-w-3xl space-y-4 sm:space-y-6">

    <!-- Mode Selector Buttons -->
    <div class="flex bg-slate-900 p-1.5 border border-slate-800 rounded-2xl gap-2">
      <button
        type="button"
        id="tabCnic"
        onclick="setSearchMode('cnic')"
        class="flex-1 py-3 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-brand-600 text-white shadow-md active:scale-95"
      >
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-4 0h4"></path></svg>
        <span>Search CNIC</span>
      </button>
      <button
        type="button"
        id="tabPhone"
        onclick="setSearchMode('phone')"
        class="flex-1 py-3 px-3 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2 active:scale-95"
      >
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        <span>Search Phone</span>
      </button>
    </div>

    <!-- Form -->
    <form id="searchForm" class="space-y-4">
      <div class="relative flex flex-col sm:flex-row items-stretch gap-2 sm:gap-0">
        
        <!-- CNIC Input Container -->
        <div id="cnicFieldContainer" class="w-full">
          <input
            type="text"
            id="cnicInput"
            inputmode="numeric"
            placeholder="36401-7737144-9"
            maxlength="15"
            class="w-full py-3.5 pl-4 pr-4 sm:pr-32 bg-slate-900 border border-slate-700/60 rounded-2xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all shadow-md font-mono text-base"
          />
        </div>

        <!-- Phone Input Container -->
        <div id="phoneFieldContainer" class="w-full hidden flex items-center bg-slate-900 border border-slate-700/60 rounded-2xl focus-within:ring-2 focus-within:ring-indigo-500/50 focus-within:border-indigo-500 transition-all shadow-md overflow-hidden">
          <span class="py-3.5 pl-4 pr-2 text-indigo-400 font-bold select-none text-base border-r border-slate-800 bg-slate-950/40 flex items-center gap-1">
            +92
          </span>
          <input
            type="text"
            id="phoneInput"
            inputmode="numeric"
            placeholder="304 7120451"
            maxlength="12"
            class="w-full py-3.5 pl-3 pr-4 sm:pr-32 bg-transparent text-slate-100 placeholder-slate-500 focus:outline-none font-mono text-base"
          />
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="sm:absolute right-2 top-2 bottom-2 px-6 py-3 sm:py-0 bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white font-medium text-sm rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 z-10 shrink-0"
        >
          <span id="btnText">Search</span>
          <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </div>

      <!-- Turnstile -->
      <div class="flex justify-center min-h-[65px]">
        <div id="turnstileContainer"></div>
      </div>
    </form>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm text-center"></div>

    <!-- Export Toolbar -->
    <div id="exportToolbar" class="hidden flex flex-col sm:flex-row gap-3 justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Export Results</span>
      <div class="flex gap-2 w-full sm:w-auto">
        <button onclick="downloadCSV()" class="flex-1 sm:flex-none justify-center px-4 py-2.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 text-xs font-bold rounded-xl transition-all flex items-center gap-2 active:scale-95">
          <img src="/assets/csv.png" alt="CSV" class="w-4 h-4 object-contain" onError="this.style.display='none'" />
          Download CSV
        </button>
        <button onclick="downloadPDF()" class="flex-1 sm:flex-none justify-center px-4 py-2.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 text-xs font-bold rounded-xl transition-all flex items-center gap-2 active:scale-95">
          <img src="/assets/pdf.png" alt="PDF" class="w-4 h-4 object-contain" onError="this.style.display='none'" />
          Download PDF
        </button>
      </div>
    </div>

    <!-- Results Area -->
    <div id="resultsContainer" class="space-y-4"></div>

  </main>

  <script>
    let activeMode = 'cnic';
    let turnstileToken = '';
    let turnstileWidgetId = null;
    let currentResults = [];

    const tabCnic = document.getElementById('tabCnic');
    const tabPhone = document.getElementById('tabPhone');
    const cnicFieldContainer = document.getElementById('cnicFieldContainer');
    const phoneFieldContainer = document.getElementById('phoneFieldContainer');
    const cnicInput = document.getElementById('cnicInput');
    const phoneInput = document.getElementById('phoneInput');

    function setSearchMode(mode) {
      activeMode = mode;
      errorAlert.classList.add('hidden');
      if (mode === 'cnic') {
        tabCnic.className = "flex-1 py-3 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-brand-600 text-white shadow-md active:scale-95";
        tabPhone.className = "flex-1 py-3 px-3 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2 active:scale-95";
        cnicFieldContainer.classList.remove('hidden');
        phoneFieldContainer.classList.add('hidden');
      } else {
        tabPhone.className = "flex-1 py-3 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-brand-600 text-white shadow-md active:scale-95";
        tabCnic.className = "flex-1 py-3 px-3 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2 active:scale-95";
        phoneFieldContainer.classList.remove('hidden');
        cnicFieldContainer.classList.add('hidden');
      }
    }

    // CNIC Formatter
    cnicInput.addEventListener('input', (e) => {
      let digits = e.target.value.replace(/\D/g, '').slice(0, 13);
      let formatted = '';

      if (digits.length > 12) {
        formatted = `${digits.slice(0, 5)}-${digits.slice(5, 12)}-${digits.slice(12)}`;
      } else if (digits.length > 5) {
        formatted = `${digits.slice(0, 5)}-${digits.slice(5)}`;
      } else {
        formatted = digits;
      }

      e.target.value = formatted;
    });

    // Phone Formatter
    phoneInput.addEventListener('input', (e) => {
      let digits = e.target.value.replace(/\D/g, '');

      if (digits.startsWith('92') && digits.length > 2) {
        digits = digits.slice(2);
      }
      if (digits.startsWith('0')) {
        digits = digits.slice(1);
      }

      digits = digits.slice(0, 10);

      let formatted = '';
      if (digits.length > 3) {
        formatted = `${digits.slice(0, 3)} ${digits.slice(3)}`;
      } else {
        formatted = digits;
      }

      e.target.value = formatted;
    });

    async function initTurnstile() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();

        if (!res.ok || !data.siteKey) {
          throw new Error(data.error || 'Failed to load security site key.');
        }

        const checkInterval = setInterval(() => {
          if (window.turnstile) {
            clearInterval(checkInterval);
            turnstileWidgetId = turnstile.render('#turnstileContainer', {
              sitekey: data.siteKey,
              theme: 'dark',
              callback: (token) => { turnstileToken = token; },
              'expired-callback': () => { turnstileToken = ''; }
            });
          }
        }, 100);
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.remove('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', initTurnstile);

    const form = document.getElementById('searchForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorAlert = document.getElementById('errorAlert');
    const resultsContainer = document.getElementById('resultsContainer');
    const exportToolbar = document.getElementById('exportToolbar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      let queryVal = '';

      if (activeMode === 'cnic') {
        queryVal = cnicInput.value.replace(/\D/g, '');
        if (queryVal.length !== 13) {
          errorAlert.textContent = "Please enter a valid 13-digit CNIC number.";
          errorAlert.classList.remove('hidden');
          return;
        }
      } else {
        queryVal = phoneInput.value.replace(/\D/g, '');
        if (queryVal.length !== 10) {
          errorAlert.textContent = "Please enter a valid 10-digit phone number.";
          errorAlert.classList.remove('hidden');
          return;
        }
      }

      if (!turnstileToken) {
        errorAlert.textContent = "Please complete the security check first.";
        errorAlert.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = "Searching...";
      btnSpinner.classList.remove('hidden');
      errorAlert.classList.add('hidden');
      exportToolbar.classList.add('hidden');
      resultsContainer.innerHTML = '';
      currentResults = [];

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(queryVal)}&cf-turnstile-response=${encodeURIComponent(turnstileToken)}`);
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Search failed.');

        if (data.results && data.results.length > 0) {
          currentResults = data.results;
          renderResults(data.results);
          exportToolbar.classList.remove('hidden');
        } else {
          showEmptyState();
        }
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = "Search";
        btnSpinner.classList.add('hidden');

        if (window.turnstile && turnstileWidgetId !== null) {
          turnstile.reset(turnstileWidgetId);
          turnstileToken = '';
        }
      }
    });

    function renderResults(results) {
      resultsContainer.innerHTML = results.map((item, index) => `
        <div class="p-4 sm:p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-lg space-y-4">
          <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Record #${index + 1}</span>
            <button onclick="copyToClipboard('${escapeJs(JSON.stringify(item))}', this)" class="text-xs text-slate-400 hover:text-white bg-slate-800 active:bg-slate-700 px-3 py-1.5 rounded-lg transition-all">
              Copy JSON
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            ${createField('Name', item.name)}
            ${createField('Phone', item.phone)}
            ${createField('CNIC', item.cnic)}
            ${createField('Address', item.address, true)}
          </div>
        </div>
      `).join('');
    }

    function createField(label, value, fullWidth = false) {
      return `
        <div class="${fullWidth ? 'sm:col-span-2' : ''} bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl flex justify-between items-center">
          <div class="overflow-hidden pr-2">
            <div class="text-[10px] sm:text-xs text-slate-500 font-medium">${label}</div>
            <div class="text-xs sm:text-sm text-slate-200 font-semibold mt-0.5 truncate">${value || 'N/A'}</div>
          </div>
          <button onclick="copyToClipboard('${escapeJs(value)}', this)" class="text-slate-500 hover:text-slate-300 p-1.5 rounded transition-all shrink-0 active:scale-90">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </button>
        </div>
      `;
    }

    function showEmptyState() {
      resultsContainer.innerHTML = `
        <div class="text-center py-10 bg-slate-900 border border-slate-800 rounded-2xl">
          <p class="text-slate-400 text-sm">No records found matching your query.</p>
        </div>
      `;
    }

    // Mobile-compatible CSV download using Blob & Object URLs
    function downloadCSV() {
      if (!currentResults.length) return;
      const headers = ["Name", "Phone", "CNIC", "Address"];
      const rows = currentResults.map(r => [
        `"${(r.name || '').replace(/"/g, '""')}"`,
        `"${(r.phone || '').replace(/"/g, '""')}"`,
        `"${(r.cnic || '').replace(/"/g, '""')}"`,
        `"${(r.address || '').replace(/"/g, '""')}"`
      ]);

      const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\r\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      
      link.setAttribute("href", url);
      link.setAttribute("download", `search_results_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    // Mobile-compatible PDF download using Blob & Object URLs
    function downloadPDF() {
      if (!currentResults.length) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Search Results Report", 14, 20);

      const tableData = currentResults.map((r, i) => [
        i + 1,
        r.name || 'N/A',
        r.phone || 'N/A',
        r.cnic || 'N/A',
        r.address || 'N/A'
      ]);

      doc.autoTable({
        startY: 30,
        head: [['#', 'Name', 'Phone', 'CNIC', 'Address']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [79, 70, 229] }
      });

      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `search_results_${Date.now()}.pdf`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    function escapeJs(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text);
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="text-emerald-400 text-xs">Copied!</span>';
      setTimeout(() => { btn.innerHTML = originalText; }, 1500);
    }
  </script>
</body>
</html>
